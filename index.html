<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samanvay (समनवय) – Garden of Harmony</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 20%, #f7fbf8 0%, #e8f3ec 100%); min-height: 100vh; color: #2d3748; }
    .glass { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(10px); border: 1px solid #dcece1; box-shadow: 0 10px 25px rgba(45,75,55,0.05); }
  </style>
</head>
<body class="p-3 md:p-6 flex flex-col items-center">
  <header class="text-center max-w-md my-3">
    <div class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-semibold inline-block mb-1">A Heartfulness Mindful Sanctuary</div>
    <h1 class="text-2xl md:text-3xl font-bold text-stone-800">समनवय <span class="text-emerald-700 font-light">| Samanvay</span></h1>
    <p class="text-xs text-stone-600 mt-1">Roll gently, breathe deep, and nurture inner healing.</p>
    <div class="flex justify-center gap-2 mt-2">
      <button onclick="toggleAudio()" id="audBtn" class="px-3 py-1 rounded-full border border-stone-300 bg-white text-xs text-stone-700">🌱 Ambient: Off</button>
      <button onclick="resetGame()" class="px-3 py-1 rounded-full border border-stone-200 bg-stone-100 text-xs text-stone-600">Reset</button>
    </div>
  </header>

  <main class="w-full max-w-3xl glass rounded-3xl p-4 mb-4">
    <div class="flex justify-between text-xs text-stone-600 mb-2 font-medium">
      <span id="locLabel" class="text-emerald-800">📍 Aarambh (Beginning)</span>
      <span id="stepLabel" class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full border border-emerald-200">Step 1/24</span>
    </div>
    <div class="rounded-2xl border border-stone-200 overflow-hidden bg-white shadow-inner">
      <canvas id="cvs" width="800" height="420" class="w-full h-auto block"></canvas>
    </div>
    <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-3 p-3 bg-stone-50 rounded-2xl border border-stone-200">
      <div id="subText" class="text-xs text-stone-600 italic text-center sm:text-left">"Every step in awareness brings you back to your sacred center."</div>
      <div class="flex items-center gap-3">
        <div id="dice" class="w-10 h-10 rounded-xl bg-white border border-stone-300 flex items-center justify-center font-bold text-emerald-700 text-lg shadow-sm">🌱</div>
        <button id="btnRoll" onclick="rollSteps()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs shadow-md transition">Roll (1–4)</button>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modalBox" class="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass max-w-sm w-full rounded-3xl p-6 text-center">
      <div id="mIcon" class="text-3xl mb-2">🌸</div>
      <h3 id="mTitle" class="text-lg font-bold text-stone-800 mb-2">Sanctuary</h3>
      <div id="mBody" class="text-xs text-stone-700 bg-emerald-50/80 p-3 rounded-xl border border-emerald-100 mb-4 leading-relaxed text-left"></div>
      <button onclick="closeM()" class="w-full py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow transition">Accept & Continue</button>
    </div>
  </div>

  <script>
    let aCtx = null, drone = null, isDrone = false;
    function getACtx() { if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)(); return aCtx; }
    function chime(f = 432, t = 1.5) {
      try {
        const c = getACtx(), o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(f, c.currentTime);
        g.gain.setValueAtTime(0.2, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + t);
      } catch(e){}
    }
    function toggleAudio() {
      const c = getACtx();
      if (!isDrone) {
        drone = c.createOscillator(); const g = c.createGain();
        drone.type = 'sine'; drone.frequency.setValueAtTime(108, c.currentTime);
        g.gain.setValueAtTime(0.03, c.currentTime);
        drone.connect(g); g.connect(c.destination); drone.start();
        isDrone = true; document.getElementById('audBtn').innerText = '🌱 Ambient: On';
      } else {
        if (drone) drone.stop();
        isDrone = false; document.getElementById('audBtn').innerText = '🌱 Ambient: Off';
      }
    }

    const data = [
      { id:1, t:'Aarambh (Gentle Start)', d:'Step gently into recovery.', type:'n' },
      { id:2, t:'Thodi Saans (Deep Breath)', d:'Take 3 deep, grounding breaths.', type:'m', txt:'Inhale peace for 4s, hold for 2s, exhale all tension for 4s.' },
      { id:3, t:'Prakriti (Firm Roots)', d:'Feel the unconditional stability of Earth.', type:'n' },
      { id:4, t:'Apne Saath (Truth Within)', d:'Reflect upon inner innocence.', type:'m', txt:'You loved purely and honestly. Another person’s betrayal is their moral choice, never your worth.' },
      { id:5, t:'Nirmalta (Heart Cleaning)', d:'Discharge burdens from the heart.', type:'m', txt:'Gently visualize heavy thoughts and hurt leaving your back as light vapor into the sky.' },
      { id:6, t:'Shukriya (Gratitude)', d:'Give thanks for one gentle moment.', type:'m', txt:'Acknowledge one strength, person, or peaceful breath you experienced today.' },
      { id:7, t:'Sahajta (Simplicity)', d:'Life heals when we stop over-analyzing.', type:'n' },
      { id:8, t:'Thodi Saans (Expansion)', d:'Create spacious stillness in the chest.', type:'m', txt:'Breathe deeply into your heart center and release heaviness.' },
      { id:9, t:'Apne Saath (Forgiving Self)', d:'Release self-blame.', type:'m', txt:'Forgive yourself for trusting. To trust is divine; breaking trust belongs to the one who faltered.' },
      { id:10, t:'Prakriti (Flowing Stream)', d:'Flow naturally around stones.', type:'n' },
      { id:11, t:'Nirmalta (Cleansing Smoke)', d:'Wash away painful words.', type:'m', txt:'All harsh words and deceptions fade into nothingness. The core within remains clean.' },
      { id:12, t:'Vishram (Quiet Waters)', d:'There is nowhere you need to rush.', type:'n' },
      { id:13, t:'Shukriya (Your Courage)', d:'Honor your enduring heart.', type:'m', txt:'Be grateful for your resilience. Even amidst sorrow, you choose kindness.' },
      { id:14, t:'Apne Saath (New Growth)', d:'Pruned branches make way for blossoms.', type:'m', txt:'What fell away was toxic. You are creating room for genuine light and healing.' },
      { id:15, t:'Thodi Saans (Release)', d:'Cool breeze clearing mental fog.', type:'m', txt:'Exhale deeply and let go of exhaustion from your feet and eyes.' },
      { id:16, t:'Prakriti (The Clear Sky)', d:'Storms pass, the blue sky remains untouched.', type:'n' },
      { id:17, t:'Nirmalta (Freedom)', d:'Letting go of resentment heals you.', type:'m', txt:'Freeing others from your mental court is the ultimate peace gift to yourself.' },
      { id:18, t:'Ananda (Subtle Joy)', d:'Touch the quiet spark within.', type:'n' },
      { id:19, t:'Shukriya (Creative Spark)', d:'Celebrate your talents and mind.', type:'m', txt:'Give thanks for your creativity, insight, and ability to build meaningful things.' },
      { id:20, t:'Apne Saath (The Rising Star)', d:'Your light was never borrowed.', type:'m', txt:'The warmth you shared was your own inner light. No one can ever take that away.' },
      { id:21, t:'Thodi Saans (Wholeness)', d:'Three sacred breaths for deep restoration.', type:'m', txt:'Inhale calm, exhale sorrow. Rest peacefully in this moment.' },
      { id:22, t:'Prakriti (Dawn)', d:'Night can never stop the morning sun.', type:'n' },
      { id:23, t:'Nirmalta (Purity)', d:'Step forward with a crystal-clean heart.', type:'n' },
      { id:24, t:'Shanti (Inner Peace)', d:'You have arrived home within.', type:'m', txt:'You walked through reflection, release, and calm. You are whole, strong, and deeply peaceful.' }
    ];

    let cur = 1, rolling = false;
    const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');

    function getCoords(i) {
      const r = Math.floor(i / 6), cInR = i % 6, c = (r % 2 === 0) ? cInR : (5 - cInR);
      const px = 75, py = 65, sx = (cvs.width - px * 2) / 5, sy = (cvs.height - py * 2) / 3;
      return { x: px + c * sx, y: cvs.height - (py + r * sy) };
    }

    function draw() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.beginPath();
      for (let i = 0; i < 24; i++) {
        const p = getCoords(i);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = '#d7ebe0'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.stroke();

      for (let i = 0; i < 24; i++) {
        const p = getCoords(i), isCur = (cur === i + 1);
        ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = (i === 23) ? '#a7f3d0' : (data[i].type === 'm' ? '#fef08a' : '#ffffff');
        ctx.fill();
        ctx.lineWidth = isCur ? 3 : 1.5; ctx.strokeStyle = isCur ? '#059669' : '#94a3b8'; ctx.stroke();
        ctx.fillStyle = '#1e293b'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(i + 1, p.x, p.y);
      }

      const cp = getCoords(cur - 1);
      ctx.beginPath(); ctx.arc(cp.x, cp.y - 3, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#047857'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    }

    function rollSteps() {
      if (rolling) return;
      rolling = true; chime(300, 0.2);
      let r = Math.floor(Math.random() * 4) + 1;
      if (cur + r > 24) r = 24 - cur;
      if (r === 0) r = 1;

      let cnt = 0;
      const t = setInterval(() => {
        document.getElementById('dice').innerText = ['🌱', '🌸', '🍃', '🕊️'][cnt % 4];
        cnt++;
        if (cnt > 5) {
          clearInterval(t);
          document.getElementById('dice').innerText = r;
          stepForward(r);
        }
      }, 80);
    }

    function stepForward(rem) {
      if (rem <= 0) {
        rolling = false;
        checkTile();
        return;
      }
      cur++; chime(420 + cur * 10, 0.2);
      updateUI();
      setTimeout(() => stepForward(rem - 1), 220);
    }

    function updateUI() {
      const itm = data[cur - 1];
      document.getElementById('locLabel').innerText = `📍 ${itm.t}`;
      document.getElementById('stepLabel').innerText = `Step ${cur}/24`;
      document.getElementById('subText').innerText = `"${itm.d}"`;
      draw();
    }

    function checkTile() {
      const itm = data[cur - 1];
      if (itm.type === 'm') {
        document.getElementById('mTitle').innerText = itm.t;
        document.getElementById('mBody').innerText = itm.txt;
        document.getElementById('modalBox').classList.remove('hidden');
        chime(528, 2);
      }
    }
    function closeM() { document.getElementById('modalBox').classList.add('hidden'); }
    function resetGame() { cur = 1; updateUI(); chime(432, 1.5); }

    window.addEventListener('load', () => { draw(); updateUI(); });
  </script>
</body>
</html>
